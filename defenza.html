        .slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; z-index: 10; }
        .slide.salir-izquierda { opacity: 0; transform: translateX(-60px) scale(0.98); pointer-events: none; z-index: 5; }
        .slide.entrar-derecha { opacity: 0; transform: translateX(60px) scale(0.98); pointer-events: none; }

        /* Animaciones */
        .slide.active .node, .slide.active .card-conclusion, .slide.active .portada-logo, .slide.active .titulo-portada, .slide.active .subtitulo-portada, .slide.active .badge-tema { animation: fadeInUp 0.6s ease forwards; opacity: 0; }

        .slide.active .portada-logo { animation-delay: 0.1s; } .slide.active .titulo-portada { animation-delay: 0.2s; } .slide.active .subtitulo-portada { animation-delay: 0.3s; } .slide.active .badge-tema { animation-delay: 0.05s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        /* Logo UNIPOL */
        .logo-unipol { position: absolute; top: 16px; right: 28px; width: 95px; height: auto; z-index: 10; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7)); border-radius: 50%; background-color: #ffffff10; padding: 4px; border: 2px solid #e6c84c60; }
        .portada-logo { display: flex; justify-content: center; align-items: center; margin: 0 0 8px 0; }
        .portada-logo img { width: 150px; height: auto; filter: drop-shadow(0 8px 16px #00000090); border-radius: 50%; background-color: #ffffff12; padding: 10px; border: 3px solid #e6c84c; }
        .titulo-portada { font-size: 2.5rem; font-weight: 800; text-align: center; color: #ffe066; text-shadow: 3px 3px 0 #0a120a, 0 0 25px #e6c84c90; letter-spacing: 1.5px; line-height: 1.15; margin: 4px 0 2px 0; text-transform: uppercase; }
        .subtitulo-portada { font-size: 1.15rem; text-align: center; color: #ffd633; font-weight: 500; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 2px solid #e6c84c80; padding-bottom: 8px; width: 70%; margin-left: auto; margin-right: auto; }
        .badge-tema { background-color: #e6c84c; color: #0f1a0f; font-weight: 800; padding: 5px 22px; border-radius: 30px; font-size: 0.95rem; letter-spacing: 1.5px; display: inline-block; margin-bottom: 6px; }

        /* Títulos y Nodos */
        .slide-title { font-size: 1.6rem; font-weight: 800; color: #ffe066; text-shadow: 2px 2px 0 #0a120a; border-left: 10px solid #e6c84c; padding-left: 18px; margin-bottom: 14px; margin-top: 2px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .slide-title span { font-size: 0.9rem; color: #e6c84c; font-weight: 500; margin-left: auto; background-color: #0a120a90; padding: 4px 16px; border-radius: 30px; letter-spacing: 1px; border: 1px solid #e6c84c60; }
        
        /* REJILLA INTELIGENTE: Se estira para llenar el espacio vertical */
        .map-grid { 
            display: grid;

        }
        .map-grid::-webkit-scrollbar { width: 6px; } .map-grid::-webkit-scrollbar-thumb { background: #e6c84c; border-radius: 10px; }
        
        .node { 
            background: linear-gradient(145deg, #1f3f1f, #152b15);

        .node h3 { font-size: 1.1rem; font-weight: 700; color: #ffd633; margin-bottom: 8px; border-bottom: 1px dashed #e6c84c; padding-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .node h3 .icono { font-size: 1.3rem; line-height: 1; }

        .node ul li { margin-bottom: 6px; padding-left: 22px; position: relative; }
        .node ul li::before { content: "▹"; color: #e6c84c; font-weight: bold; position: absolute; left: 2px; }
        .node strong { color: #ffe066; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; align-content: stretch; }
        .card-conclusion { background: #1f3f1f; border: 3px solid #e6c84c; border-radius: 22px; padding: 25px 35px; color: #ffe066; box-shadow: 0 7px 0 #0a120a; margin-top: 6px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-conclusion h3 { font-size: 1.4rem; margin-bottom: 12px; border-bottom: 2px solid #e6c84c; padding-bottom: 8px; display: flex; align-items: center; gap: 12px; color: #ffd633; }
        .card-conclusion p { font-size: 1.05rem; line-height: 1.6; color: #f5e6b0; margin-bottom: 10px; }
        
        .footer-slide { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #d4c28a; border-top: 1px solid #e6c84c50; padding-top: 8px; letter-spacing: 1px; flex-shrink: 0; }
        .footer-slide .num { background-color: #e6c84c20; padding: 3px 14px; border-radius: 30px; border: 1px solid #e6c84c; font-weight: 600; color: #ffe066; }

        /* Controles */
        .nav-controls { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 14px; z-index: 100; background: #0a120a80; padding: 8px 20px; border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid #e6c84c60; box-shadow: 0 4px 20px #00000080; }
        .nav-controls.active { display: flex; }
        .nav-btn { background: #e6c84c20; border: 2px solid #e6c84c; color: #ffe066; width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; user-select: none; }
        .nav-btn:hover { background: #e6c84c; color: #0a120a; transform: scale(1.08); box-shadow: 0 0 18px #e6c84c80; }
        .nav-btn:active { transform: scale(0.95); }
        .slide-counter { color: #ffe066; font-weight: 700; font-size: 0.95rem; min-width: 60px; text-align: center; letter-spacing: 1px; }
        .progress-bar { position: fixed; bottom: 0; left: 0; height: 4px; background: #e6c84c; transition: width 0.4s ease; z-index: 110; box-shadow: 0 0 12px #e6c84c; display: none; }
        .progress-bar.active { display: block; }

        .btn-back-menu { position: fixed; top: 20px; left: 20px; z-index: 200; background: #e6c84c; color: #0a120a; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 700; cursor: pointer; display: none; box-shadow: 0 4px 10px #00000080; transition: all 0.2s; }
        .btn-back-menu.active { display: block; }
        .btn-back-menu:hover { background: #ffe066; transform: scale(1.05); }

        @media (max-width: 1350px) { .slides-container { width: 96vw; height: calc(96vw * 9 / 16); max-height: 90vh; } }
        @media (max-width: 900px) { .slide { padding: 18px 20px; } .titulo-portada { font-size: 2rem; } .portada-logo img { width: 120px; } .logo-unipol { width: 70px; top: 12px; right: 14px; } .map-grid { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; } .slide-title { font-size: 1.3rem; } }
        @media (max-width: 600px) { .map-grid { grid-template-columns: 1fr; } .slide-title { font-size: 1.1rem; } .logo-unipol { width: 50px; } .nav-btn { width: 34px; height: 34px; font-size: 1rem; } .nav-controls { gap: 8px; padding: 6px 12px; } }

<body>

    <!-- MENÚ PRINCIPAL -->
    <div class="menu-container" id="menuContainer">

    <!-- CONTENEDOR DE DIAPOSITIVAS -->

        <!-- Diapositivas generadas por JS -->

    <div class="nav-controls" id="navControls">
        <button class="nav-btn" id="prevBtn" aria-label="Anterior">◀</button>

    <script>
        // ============================================================
        // DATOS DE LOS 15 TEMAS (Contenido ampliado para llenar las diapositivas)
        // ============================================================
        const temas = [
            // TEMA 1
            {
                titulo: "Doctrina e Historia Policial",
                icono: "📜",
                diapositivas: [
                    { portada: true, titulo: "DOCTRINA E HISTORIA<br>POLICIAL", subtitulo: "MAPA CONCEPTUAL PARA DEFENSA DE GRADO" },
                    { titulo: "📌 INTRODUCCIÓN E HISTORIA INSTITUCIONAL", tag: "I", contenido: `
                        <div class="node"><h3>🎯 Propósito del Tema</h3><p>Estudiar la formación histórica de la institución policial boliviana y los elementos conceptuales que estructuran su doctrina: evolución normativa, transformaciones orgánicas, principios, valores, deberes, fuentes y gestión doctrinal.</p></div>
                        <div class="node"><h3>🏛️ Doctrina Institucional</h3><p>Articula identidad, misión, principios, valores y criterios de actuación que orientan de manera uniforme el servicio policial (Policía Boliviana, 2025). La doctrina no es estática, se nutre de la experiencia y se adapta a los nuevos desafíos sociales.</p></div>
                        <div class="node" style="grid-column: span 2; border-color: #ffd633;"><h3>📜 Línea de Tiempo: Desde el Ayllu hasta la Constitución de 2009</h3><ul style="columns: 2; column-gap: 30px;"><li><strong>Precolombina:</strong> autoridad, vigilancia comunitaria y control social en el ayllu.</li><li><strong>Colonia:</strong> función policial dispersa (cabildos, corregidores, alcaldes).</li><li><strong>1826 – Ley Reglamentaria:</strong> primer marco normativo republicano.</li><li><strong>1826 – Gendarmería e Intendencia:</strong> vigilancia y control administrativo.</li><li><strong>1831 – Guardia Nacional:</strong> apoyo a defensa del orden interno.</li><li><strong>1937 – Cuerpo Nacional de Policías y Carabineros:</strong> integración y profesionalización.</li><li><strong>1961 – Policía Boliviana:</strong> consolidación institucional e identidad propia.</li><li><strong>1965 – Guardia Nacional de Seguridad Pública:</strong> énfasis en seguridad pública.</li><li><strong>1967 – Policía Nacional:</strong> carácter unitario y cobertura estatal.</li><li><strong>2009 – Policía Boliviana:</strong> legalidad, derechos humanos, interculturalidad y servicio a la sociedad.</li></ul></div>
                    `},
                    { titulo: "⚖️ DOCTRINA INSTITUCIONAL: DIMENSIÓN, ETIMOLOGÍA Y DEFINICIÓN", tag: "II", contenido: `
                        <div class="node"><h3>🧭 Dimensión de la Policía Boliviana</h3><ul><li><strong>Jurídica:</strong> competencias y límites</li><li><strong>Organizacional:</strong> estructura y mando</li><li><strong>Social:</strong> vínculo con la comunidad</li><li><strong>Ética:</strong> orienta la conducta</li><li><strong>Operativa:</strong> traduce la misión en servicios</li><li><strong>Histórica:</strong> preserva la memoria</li><li><strong>Cultural:</strong> fortalece la identidad</li></ul><p style="margin-top: 6px; font-style: italic; color: #ffd633;">Sistema integral e interrelacionado.</p></div>
                        <div class="node"><h3>📖 Etimología de "Doctrina"</h3><p>Del latín <strong>doctrina</strong>: enseñanza, instrucción, conocimiento transmitido.</p><p style="margin-top: 6px;">Es esencialmente formativa: se aprende, se enseña, se interpreta y se aplica. Su conservación depende de procesos educativos, documentos oficiales, liderazgo ejemplar y práctica profesional (Michel, 2013).</p></div>
                        <div class="node" style="grid-column: span 2; border-color: #ffd633;"><h3>📌 Definición de la Doctrina de la Policía Boliviana</h3><p>Conjunto sistemático y dinámico de principios, valores, normas, conocimientos, tradiciones, experiencias y criterios institucionales que orientan la formación, organización, decisión y actuación policial en cumplimiento de la misión constitucional (Policía Boliviana, 2025).</p><ul style="margin-top: 8px; columns: 2; column-gap: 30px;"><li><strong>Sistemático:</strong> coherencia entre componentes</li><li><strong>Dinámico:</strong> actualización frente a nuevas amenazas y demandas</li><li><strong>Institucional:</strong> orientación común para todo el personal</li></ul></div>
                    `},
                    { titulo: "🛡️ PRINCIPIOS, VALORES Y CARACTERÍSTICAS", tag: "III", contenido: `
                        <div class="node"><h3>⚖️ Principios Institucionales</h3><ul><li>Legalidad</li><li>Disciplina</li><li>Jerarquía</li><li>Unidad</li><li>Profesionalismo</li><li>Imparcialidad</li><li>Responsabilidad</li><li>Respeto a los derechos humanos</li><li>Servicio a la sociedad</li><li>Uso racional de la fuerza</li></ul><p style="margin-top: 6px;">Criterios de control y coherencia institucional.</p></div>
                        <div class="node"><h3>💎 Valores Institucionales</h3><ul><li>Honor</li><li>Honestidad</li><li>Lealtad</li><li>Respeto</li><li>Solidaridad</li><li>Valentía</li><li>Justicia</li><li>Integridad</li><li>Vocación de servicio</li><li>Compromiso</li></ul><p style="margin-top: 6px;">Disposiciones morales y rasgos de carácter profesional.</p></div>
                        <div class="node"><h3>🏛️ Características Institucionales</h3><ul><li>Institución fundamental del Estado</li><li>Organizada y jerarquizada</li><li>Disciplinada</li><li>Profesional</li><li>Permanente</li><li>Alcance nacional</li><li>Orientada al servicio público</li></ul><p style="margin-top: 6px;">Aseguran continuidad operativa y unidad de mando.</p></div>
                    `},
                    { titulo: "📋 DEONTOLOGÍA POLICIAL Y DEBERES", tag: "IV", contenido: `
                        <div class="node" style="grid-column: span 2;"><h3>🔍 Deontología Policial</h3><p>Conjunto de deberes, obligaciones y reglas éticas propias de la profesión policial. La eficacia se subordina a la legalidad y a la dignidad humana. Una actuación aparentemente exitosa pierde legitimidad cuando se obtiene mediante abuso, discriminación, corrupción o incumplimiento del deber (Aranguren, 1990).</p></div>
                        <div class="node"><h3>📌 Deberes con la Disciplina</h3><p>Observar normas, horarios, procedimientos y órdenes legales. No es obediencia mecánica, sino cumplimiento consciente de obligaciones dentro del marco jurídico.</p></div>
                        <div class="node"><h3>🇧🇴 Deberes con la Patria</h3><p>Proteger a la sociedad, respetar el orden constitucional, preservar la soberanía y anteponer el interés general a beneficios particulares.</p></div>
                        <div class="node"><h3>🏛️ Deberes con la Institución</h3><p>Cuidar el prestigio, cumplir la normativa, usar responsablemente los bienes públicos, mantener reserva profesional y contribuir al mejoramiento del servicio.</p></div>
                        <div class="node"><h3>👤 Deberes con los Superiores</h3><p>Respeto, comunicación veraz, cumplimiento de órdenes legales, asesoramiento profesional y observancia del conducto regular. La subordinación no elimina la responsabilidad individual.</p></div>
                        <div class="node"><h3>🤝 Deberes con los Camaradas</h3><p>Solidaridad, respeto, cooperación, lealtad ética, apoyo operativo y corrección fraterna. La camaradería no justifica encubrir faltas o delitos.</p></div>
                        <div class="node"><h3>👥 Deberes con los Subalternos</h3><p>Dirigir con justicia, capacitar, proteger, corregir de manera proporcional, reconocer méritos y evitar abusos de autoridad.</p></div>
                        <div class="node"><h3>🏠 Deberes con la Familia</h3><p>Responsabilidad afectiva, económica y moral. Equilibrio entre servicio y vida familiar. Una base familiar estable favorece el desempeño profesional.</p></div>
                        <div class="node"><h3>🌱 Deberes con la Madre Tierra</h3><p>Prevenir daños ambientales, respetar normas ecológicas, proteger recursos naturales y promover un uso responsable de bienes institucionales.</p></div>
                    `},
                    { titulo: "📚 FUENTES, CICLO Y GESTIÓN PDCA", tag: "V - VI", contenido: `
                        <div class="node"><h3>📜 La Historia</h3><p>Conserva experiencias, decisiones, logros, errores, símbolos y procesos que explican la identidad institucional. Su estudio permite aprender del pasado y evitar la repetición de fallas (Molina Baeza et al., 1990).</p></div>
                        <div class="node"><h3>⚖️ La Normativa</h3><p>Constitución, leyes, reglamentos, resoluciones y manuales que regulan la misión, organización y actuación policial. Define competencias, procedimientos, deberes y límites obligatorios.</p></div>
                        <div class="node"><h3>🎭 Tradiciones y Costumbres</h3><p>Prácticas, ceremonias, símbolos, relatos y hábitos transmitidos. Fortalecen pertenencia y cohesión, siempre que sean compatibles con la legalidad, la ética y los derechos humanos.</p></div>
                        <div class="node" style="grid-column: span 3; border-color: #ffd633; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: transparent; border: none; box-shadow: none; padding: 0;">
                            <div class="node" style="background: #1f3f1f;"><h3>🔄 Ciclo de la Doctrina</h3><p>Proceso mediante el cual la institución identifica necesidades, produce o actualiza conocimientos, valida contenidos, difunde orientaciones, aplica la doctrina y evalúa sus resultados.</p><ul style="margin-top: 6px; columns: 2;"><li>Diagnóstico</li><li>Formulación</li><li>Validación</li><li>Aprobación</li><li>Difusión</li><li>Aplicación</li><li>Evaluación</li><li>Retroalimentación</li></ul></div>
                            <div class="node" style="background: #1f3f1f;"><h3>🔄 Gestión PDCA</h3><ul><li><strong>Planificar (P):</strong> identificar necesidades y objetivos</li><li><strong>Hacer (D):</strong> elaborar y aplicar contenidos</li><li><strong>Verificar (C):</strong> evaluar resultados</li><li><strong>Actuar (A):</strong> corregir deficiencias y estandarizar mejoras</li></ul><p style="margin-top: 6px;">Sistema de mejora continua que vincula el conocimiento institucional con evidencias operativas, indicadores de desempeño, supervisión y aprendizaje organizacional (Policía Boliviana, 2025).</p></div>
                        </div>
                    `},
                    { conclusion: true, titulo: "✅ CONCLUSIÓN Y SÍNTESIS", tag: "VII", contenido: `
                        <p>La historia y la doctrina de la Policía Boliviana constituyen componentes inseparables de la identidad institucional. El recorrido desde las formas iniciales de control comunitario y colonial hasta la consolidación de una institución profesional demuestra que la función policial se ha adaptado progresivamente a las necesidades del Estado y de la sociedad.</p>

                        <div class="node"><h3>⚖️ Igualdad</h3><p>Brindar protección y aplicar la ley sin discriminación, adoptando medidas diferenciadas cuando existan condiciones objetivas de vulnerabilidad.</p></div>

                    { titulo: "🏛️ BLOQUE DE CONSTITUCIONALIDAD", tag: "I", contenido: `

                    { titulo: "⚖️ LEYES SECTORIALES ESPECÍFICAS", tag: "II", contenido: `

                        <div class="node"><h3>🚫 Ley N° 263 y D.S. N° 1486</h3><p>Prevención, protección y sanción de la trata y tráfico de personas. Detección temprana, protección inmediata y coordinación especializada.</p></div>

                    { titulo: "🏛️ INSTITUCIONALIDAD POLICIAL Y RÉGIMEN DISCIPLINARIO", tag: "III", contenido: `
                        <div class="node"><h3>📋 Ley N.º 734 (Ley Orgánica)</h3><p>Define la estructura orgánica, misión constitucional, atribuciones y mando policial. Proporciona continuidad institucional y evita duplicidad de funciones.</p></div>
                        <div class="node"><h3>⚖️ Ley N.° 101 (Régimen Disciplinario)</h3><p>Tipifica faltas leves y graves, establece sanciones y preserva la disciplina e institucionalidad. Su aplicación debe respetar legalidad, tipicidad, debido proceso y proporcionalidad.</p></div>
                        <div class="node"><h3>🏛️ Órganos Disciplinarios</h3><p>Fiscalía Policial y Tribunales Disciplinarios (Departamentales y Superior). Aseguran especialización, imparcialidad y control en la determinación de responsabilidades.</p></div>
                        <div class="node"><h3>🤝 Desconcentración Policial</h3><p>Distribuye servicios, recursos y capacidad operativa hacia unidades territoriales (EPIs y Módulos Policiales) sin romper la unidad de mando (R.A. N.° 272/2014 y R.M. N.° 097/2015).</p></div>
                    `},
                    { titulo: "👥 PARTICIPACIÓN CIUDADANA Y TECNOLOGÍA", tag: "IV", contenido: `

                    `},
                    { titulo: "📋 SISTEMAS DE LA LEY N.° 1178 (SAFCO)", tag: "V", contenido: `
                        <div class="node"><h3>📊 Sistemas para Planificar y Organizar</h3><p>Sistema de Planificación Integral del Estado (SPIE), Programación de Operaciones (POA), Organización Administrativa (SOA) y Presupuesto (SP).</p></div>
                        <div class="node"><h3>⚙️ Sistemas para Ejecutar</h3><p>Administración de Personal (SAP), Administración de Bienes y Servicios (SABS), Tesorería y Crédito Público (STCP) y Contabilidad Integrada (SCI).</p></div>

                        <div class="node"><h3>⚖️ Responsabilidad por la Función Pública</h3><p>Surge cuando una acción u omisión contraria al ordenamiento produce consecuencias disciplinarias, de gestión, patrimoniales o penales (Bolivia, 1990).</p></div>
                    `},
                    { titulo: "⚖️ TIPOLOGÍA DE RESPONSABILIDAD", tag: "VI", contenido: `
                        <div class="node"><h3>📋 Responsabilidad Administrativa</h3><p>Incumplimiento del ordenamiento jurídico-administrativo y de las normas que regulan la conducta funcionaria. Se determina mediante procedimiento y prueba (Ley N.° 101).</p></div>
                        <div class="node"><h3>📊 Responsabilidad Ejecutiva</h3><p>Gestión deficiente o negligente de la máxima autoridad ejecutiva o de quien ejerce funciones de dirección.</p></div>
                        <div class="node"><h3>💰 Responsabilidad Civil</h3><p>Daño económico computable en dinero al Estado (resarcimiento). Requiere establecer conducta, daño, cuantificación y vínculo causal.</p></div>
                        <div class="node"><h3>⚖️ Responsabilidad Penal</h3><p>Comisión de delitos tipificados en el Código Penal. Su determinación corresponde a autoridades competentes y exige investigación, prueba y debido proceso.</p></div>
                        <div class="node"><h3>📜 Causales de Exención y Prescripción</h3><p>Las causales de exención deben interpretarse restrictivamente y acreditarse objetivamente. La prescripción limita temporalmente el ejercicio de acciones (Bolivia, 1990).</p></div>
                        <div class="node"><h3>🛡️ Principio de Prueba</h3><p>Decisiones adoptadas con fundamento técnico y orientadas al beneficio público dentro de la competencia, documentadas para su revisión posterior.</p></div>
                    `},
                    { conclusion: true, titulo: "✅ CONCLUSIÓN", tag: "VII", contenido: `
                        <p>La legislación policial y de seguridad ciudadana conforma un sistema integral que articula supremacía constitucional, leyes sectoriales, organización institucional, desconcentración territorial, participación ciudadana, tecnología, administración pública y responsabilidad funcional.</p>
                        <p>El desempeño policial profesional exige conocimiento normativo, criterio jurídico, capacidad de análisis territorial, sensibilidad frente a víctimas y rigor administrativo (Bolivia, 2009; Bolivia, 2012; Bolivia, 1990).</p>

                    { titulo: "⚖️ DEONTOLOGÍA Y DOCTRINA INSTITUCIONAL", tag: "I", contenido: `
                        <div class="node"><h3>📖 Deontología</h3><p>Disciplina que estudia los deberes, obligaciones y estándares de conducta propios de una profesión. En el ámbito policial traduce los valores en exigencias concretas (Cortina, 2003).</p></div>
                        <div class="node"><h3>🏛️ Doctrina Policial</h3><p>Sistema institucional de ideas, normas, valores y experiencias que da unidad al pensamiento y a la acción policial (Policía Boliviana, 2018).</p></div>
                        <div class="node"><h3>🤝 Vocación de Servicio</h3><p>Disposición consciente y permanente para atender necesidades colectivas, proteger derechos y contribuir a la convivencia pacífica.</p></div>
                        <div class="node"><h3>📜 Código de Ética</h3><p>Guía vinculante para resolver dilemas profesionales. Relaciona valores, deberes, prohibiciones y responsabilidades con situaciones concretas del servicio.</p></div>
                    `},
                    { titulo: "👑 LIDERAZGO POLICIAL", tag: "II", contenido: `
                        <div class="node"><h3>👑 Definición</h3><p>Capacidad de orientar personas y equipos hacia el cumplimiento legítimo de la misión, integrando autoridad, competencia técnica, ejemplo personal y responsabilidad (Bass y Bass, 2008).</p></div>
                        <div class="node"><h3>⚖️ Mando y Subordinación</h3><p>Mandar supone ejercer autoridad formal; la subordinación voluntaria surge cuando el personal reconoce competencia, justicia y ejemplo en quien dirige.</p></div>
                        <div class="node"><h3>🔄 Obediencia Reflexiva</h3><p>Cumplir órdenes comprendiendo su finalidad, legalidad y límites. Se diferencia de la obediencia ciega porque admite análisis profesional y rechazo de instrucciones ilícitas.</p></div>
                        <div class="node"><h3>👥 Jefe Coercitivo vs. Líder Institucional</h3><p>El primero depende del temor y la amenaza; el segundo combina autoridad legal con influencia positiva, ejemplo y desarrollo del personal (Chiavenato, 2020).</p></div>
                    `},
                    { titulo: "📋 ESTILOS DE LIDERAZGO", tag: "III", contenido: `
                        <div class="node"><h3>👑 Liderazgo Autocrático</h3><p>Puede ser necesario en operaciones de alto riesgo, tiempo mínimo y necesidad de coordinación estricta. Exige órdenes breves, roles definidos y supervisión directa.</p></div>
                        <div class="node"><h3>🗳️ Liderazgo Democrático</h3><p>Incorpora conocimientos y perspectivas del equipo. Útil en proyectos preventivos, diagnóstico comunitario y coordinación interinstitucional.</p></div>
                        <div class="node"><h3>🕊️ Liderazgo Laissez-Faire</h3><p>Mínima intervención del líder. Puede permitir autonomía a especialistas competentes, pero en una patrulla sin objetivos ni control genera dispersión.</p></div>
                        <div class="node"><h3>🌟 Liderazgo Transformacional</h3><p>Busca elevar motivación, sentido de misión, innovación y desarrollo profesional. Moviliza a los integrantes para superar intereses inmediatos (Bass y Bass, 2008).</p></div>
                    `},
                    { titulo: "📜 CORRESPONDENCIA Y DOCUMENTACIÓN POLICIAL", tag: "IV", contenido: `
                        <div class="node"><h3>📜 Definición</h3><p>Comunicaciones escritas que circulan dentro y fuera de la institución para transmitir órdenes, solicitudes, informes, respuestas y decisiones (Cabanellas, 2015).</p></div>
                        <div class="node"><h3>⭐ Características</h3><p>Formalidad, claridad, concisión, objetividad, exactitud, oportunidad, jerarquía, trazabilidad y reserva cuando corresponde.</p></div>
                        <div class="node"><h3>📊 Clasificación</h3><p>Por naturaleza (informativa, dispositiva, consultiva, solicitante, de coordinación o respuesta) y por nivel de confidencialidad (ordinaria o reservada).</p></div>
                        <div class="node"><h3>📋 Documentación Policial</h3><p>Actas, informes, partes, formularios, libros y órdenes que acreditan la actividad policial. Deben ser auténticas, íntegras, legibles, cronológicas y seguras.</p></div>
                    `},
                    { titulo: "🤝 RELACIONES HUMANAS Y TRATO SOCIAL", tag: "V", contenido: `
                        <div class="node"><h3>🤝 Relaciones Humanas</h3><p>Estudian la interacción entre personas, grupos, institución y comunidad. Su calidad influye en cooperación, clima laboral, legitimidad y prevención de conflictos (Chiavenato, 2020).</p></div>
                        <div class="node"><h3>🌐 Relaciones Públicas</h3><p>Función estratégica de comunicación que identifica públicos, analiza percepciones, informa, escucha y construye relaciones de confianza.</p></div>
                        <div class="node"><h3>😊 Buen Trato</h3><p>Práctica profesional basada en dignidad, igualdad, cortesía, empatía, paciencia y ausencia de discriminación. No significa renunciar a la firmeza.</p></div>
                        <div class="node"><h3>📋 Normas de Trato Social</h3><p>Saludo, puntualidad, presentación, lenguaje, respeto de jerarquías, discreción y comportamiento en actos públicos.</p></div>
                    `},
                    { titulo: "🗣️ EXPRESIÓN ORAL Y ESCRITA", tag: "VI", contenido: `
                        <div class="node"><h3>🗣️ Comunicación</h3><p>Proceso mediante el cual emisor y receptor intercambian significados a través de mensajes, canales y códigos dentro de un contexto (Policía Boliviana, 2021).</p></div>
                        <div class="node"><h3>📖 Lenguaje y Gramática</h3><p>Vocabulario preciso, sintaxis clara, ortografía adecuada, coherencia y ausencia de ambigüedad. Distinguir hechos observados, declaraciones y conclusiones.</p></div>
                        <div class="node"><h3>🎤 Oratoria</h3><p>Arte y técnica de comunicar oralmente con claridad, estructura, seguridad y capacidad de influencia. Comprende preparación del contenido, dominio de la voz y lenguaje corporal.</p></div>
                        <div class="node"><h3>📝 Estructura del Discurso</h3><ul><li><strong>Introducción:</strong> capta atención y presenta propósito</li><li><strong>Desarrollo:</strong> ordena argumentos y evidencias</li><li><strong>Conclusión:</strong> sintetiza y orienta la acción</li></ul></div>
                        <div class="node"><h3>😰 Miedo Escénico</h3><p>Respuesta de ansiedad ante la exposición pública. Se reduce mediante preparación, práctica gradual, respiración y dominio temático.</p></div>
                        <div class="node"><h3>🎙️ Lenguaje y Voz</h3><p>Volumen, ritmo, tono, articulación, pausas y énfasis. Una voz firme no requiere gritar; la autoridad comunicativa se sostiene en claridad y respeto.</p></div>
                    `},
                    { conclusion: true, titulo: "✅ CONCLUSIÓN", tag: "VII", contenido: `
                        <p>La formación policial integral exige comprender que la ética, el liderazgo, la documentación, las relaciones humanas y la expresión no son contenidos independientes, sino dimensiones de una misma competencia profesional.</p>
                        <p>La deontología orienta el deber; la doctrina da identidad y coherencia; el liderazgo organiza y moviliza; la correspondencia y documentación preservan trazabilidad; las relaciones humanas legitiman el contacto con la ciudadanía; y la comunicación permite que decisiones, órdenes y actuaciones sean comprendidas y verificables (Policía Boliviana, 2018; Bolivia, 2004).</p>
                        <p>La calidad del servicio policial se consolida cuando estas dimensiones se aplican simultáneamente bajo criterios de legalidad, disciplina consciente, respeto a la dignidad y responsabilidad institucional.</p>

                    { portada: true, titulo: "PSICOLOGÍA GENERAL<br>Y APLICADA", subtitulo: "COMPRENSIÓN DE LA CONDUCTA HUMANA" },
                    { titulo: "📌 INTRODUCCIÓN A LA PSICOLOGÍA", tag: "I", contenido: `
                        <div class="node"><h3>🧠 Concepto</h3><p>Disciplina científica que estudia la conducta observable y los procesos internos como percepción, memoria, pensamiento, motivación y emoción (Morris y Maisto, 2014).</p></div>
                        <div class="node"><h3>🔄 Concepción Bio-Psico-Social</h3><p>El ser humano es una unidad en la que interactúan condiciones orgánicas, procesos psicológicos y relaciones sociales (Zimbardo y Gerrig, 2005).</p></div>
                        <div class="node"><h3>📊 Campos de Acción</h3><p>Clínica, educativa, laboral, social, comunitaria, jurídica, forense, penitenciaria y de investigación (Santrock, 2019).</p></div>
                        <div class="node"><h3>👮 Aplicación Policial</h3><p>Fortalece la comunicación profesional, la entrevista, la atención a víctimas, la prevención de violencia y el cuidado de la salud mental del servidor policial.</p></div>
                    `},
                    { titulo: "🧩 FUNCIONES Y PROCESOS PSICOLÓGICOS", tag: "II", contenido: `
                        <div class="node"><h3>👁️ Sensación</h3><p>Proceso inicial por el cual los receptores sensoriales detectan estímulos y los convierten en señales nerviosas (Myers, 2010).</p></div>
                        <div class="node"><h3>🧠 Percepción</h3><p>Organiza e interpreta la información sensorial para otorgarle significado. Influida por expectativas, experiencias y contexto (Zimbardo y Gerrig, 2005).</p></div>
                        <div class="node"><h3>🎯 Atención</h3><p>Capacidad de seleccionar información relevante y mantener recursos mentales sobre una tarea o estímulo. Disminuye por fatiga y estrés.</p></div>
                        <div class="node"><h3>💾 Memoria</h3><p>Permite codificar, almacenar y recuperar información. El recuerdo es una reconstrucción susceptible a olvidos y sugerencias (Myers, 2010).</p></div>
                        <div class="node"><h3>📚 Aprendizaje</h3><p>Cambio relativamente estable en la conducta o conocimiento como resultado de la experiencia (Bandura, 1987).</p></div>
                        <div class="node"><h3>💭 Pensamiento y Lenguaje</h3><p>El pensamiento permite representar problemas, formar conceptos y razonar; el lenguaje organiza y comunica significados (Santrock, 2019).</p></div>
                        <div class="node"><h3>❤️ Motivación y Emoción</h3><p>La motivación orienta la conducta hacia metas; la emoción integra cambios fisiológicos, experiencias subjetivas y tendencias de acción (Goleman, 1996).</p></div>
                    `},
                    { titulo: "🗣️ PSICOLOGÍA DEL TESTIMONIO", tag: "III", contenido: `
                        <div class="node"><h3>📖 Concepto General</h3><p>Narración sobre hechos experimentados o conocidos por una persona. Su valoración considera condiciones de observación, tiempo, estado emocional e influencia de terceros (Feldman, 2011).</p></div>
                        <div class="node"><h3>👤 Entrevista a Sospechoso</h3><p>Orientada a obtener información verificable mediante trato legal, respeto de derechos, escucha activa y preguntas no coercitivas (Ekman, 2003).</p></div>
                        <div class="node"><h3>🚫 Interferencias en la Percepción</h3><p>Poca iluminación, distancia, ruido, miedo, presencia de armas y atención focalizada pueden reducir la cantidad y precisión de la información (Myers, 2010).</p></div>
                        <div class="node"><h3>📝 Pautas para Entrevistar Testigos</h3><p>Establecer rapport, solicitar relato libre, formular preguntas abiertas, evitar sugestiones, respetar pausas y registrar las palabras del testigo.</p></div>
                        <div class="node"><h3>🎭 Gestos y Mentira</h3><p>El análisis de gestos puede aportar indicios sobre emoción o tensión, pero no permite diagnosticar mentira de forma automática. Debe basarse en cambios respecto de la conducta habitual y corroboración (Ekman, 2003).</p></div>
                        <div class="node"><h3>🧪 Simulación, Disimulación y Sobresimulación</h3><p>Presentar o exagerar síntomas falsos (simulación), ocultar o minimizar síntomas (disimulación) o amplificar síntomas reales (sobresimulación). Requieren evaluación especializada.</p></div>
                    `},
                    { titulo: "👤 PERSONALIDAD", tag: "IV", contenido: `
                        <div class="node"><h3>👤 Concepto</h3><p>Patrones relativamente estables de pensamiento, emoción y conducta que distinguen a una persona. Se desarrollan mediante interacción entre temperamento, aprendizaje y contexto social (Morris y Maisto, 2014).</p></div>
                        <div class="node"><h3>🧬 Características y Factores</h3><p>Relativa estabilidad, coherencia y singularidad. Intervienen herencia, temperamento, crianza, aprendizaje, cultura y experiencias críticas (Santrock, 2019).</p></div>
                        <div class="node"><h3>⚖️ Carácter, Temperamento y Personalidad</h3><p><strong>Temperamento:</strong> disposiciones emocionales con base biológica.<br><strong>Carácter:</strong> hábitos, valores y formas aprendidas de actuar.<br><strong>Personalidad:</strong> integración de ambos con cogniciones y relaciones sociales.</p></div>

        temas.forEach((tema, index) => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `<span class="num">${index + 1}</span> <span>${tema.icono} ${tema.titulo}</span>`;
            div.onclick = () => abrirTema(index);
            menuGrid.appendChild(div);
        });

        // Generar diapositivas para un tema
        function abrirTema(index) {
            currentTemaIndex = index;
            currentSlideIndex = 0;
            const tema = temas[index];
            totalSlides = tema.diapositivas.length;

            slidesContainer.innerHTML = '';

            tema.diapositivas.forEach((slideData, sIndex) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.dataset.index = sIndex;

                if (slideData.portada) {
                    slideDiv.style.cssText = 'justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at 50% 30%, #1f3f1f, #0a120a);';
                    slideDiv.innerHTML = `
                        <div class="portada-logo"><img src="cefotes.png" alt="Logo CEFOTES"></div>
                        <div class="badge-tema">UNIDAD TEMÁTICA N° ${index + 1}</div>
                        <h1 class="titulo-portada">${slideData.titulo}</h1>
                        <div class="subtitulo-portada">${slideData.subtitulo}</div>
                        <div style="margin-top: 15px; color: #e6c84c; font-size: 1.1rem; letter-spacing: 4px; font-weight: 300;">POLICÍA BOLIVIANA</div>
                        <div style="margin-top: 25px; color: #d4c28a; font-size: 0.95rem; border-top: 1px solid #e6c84c60; padding-top: 15px; width: 70%;">
                            <span style="display: inline-block; margin: 0 12px;">📜 ${tema.titulo.split(' ')[0]}</span>
                        </div>
                    `;
                } else if (slideData.conclusion) {
                    slideDiv.innerHTML = `
                        <img src="unipol.png" alt="Logo UNIPOL" class="logo-unipol">
                        <div class="slide-title">${slideData.titulo} <span>${slideData.tag}</span></div>
                        <div class="card-conclusion">${slideData.contenido}</div>
                        <div class="footer-slide"><span>CEFOTES - Formación Técnico Superior</span><span class="num">${sIndex + 1} / ${totalSlides}</span></div>
                    `;
                } else {
                    // Detecta si hay 2 o 3 columnas para ajustar el grid
                    const numNodes = (slideData.contenido.match(/<div class="node/g) || []).length;
                    const gridCols = numNodes <= 2 ? '1fr 1fr' : '1fr 1fr 1fr';
                    slideDiv.innerHTML = `
                        <img src="unipol.png" alt="Logo UNIPOL" class="logo-unipol">
                        <div class="slide-title">${slideData.titulo} <span>${slideData.tag}</span></div>
                        <div class="map-grid" style="grid-template-columns: ${gridCols};">${slideData.contenido}</div>
                        <div class="footer-slide"><span>CEFOTES - Formación Técnico Superior</span><span class="num">${sIndex + 1} / ${totalSlides}</span></div>
                    `;
                }
                slidesContainer.appendChild(slideDiv);
            });

            menuContainer.classList.add('hidden');
            slidesContainer.classList.add('active');
            navControls.classList.add('active');
            progressBar.classList.add('active');
            btnBackMenu.classList.add('active');

            const firstSlide = slidesContainer.querySelector('.slide[data-index="0"]');
            if (firstSlide) firstSlide.classList.add('active');
            updateUI();
        }

        function volverAlMenu() {
            menuContainer.classList.remove('hidden');
            slidesContainer.classList.remove('active');
            navControls.classList.remove('active');
            progressBar.classList.remove('active');
            btnBackMenu.classList.remove('active');
            slidesContainer.innerHTML = '';
            currentTemaIndex = -1;
            currentSlideIndex = 0;
        }

        function updateUI() {
            counter.textContent = (currentSlideIndex + 1) + ' / ' + totalSlides;
            progressBar.style.width = ((currentSlideIndex + 1) / totalSlides * 100) + '%';
        }

        function showSlide(newIndex, direction = 'next') {
            if (isAnimating || newIndex === currentSlideIndex || newIndex < 0 || newIndex >= totalSlides) return;
            isAnimating = true;

            const slides = slidesContainer.querySelectorAll('.slide');
            const currentSlide = slides[currentSlideIndex];
            const nextSlide = slides[newIndex];

            slides.forEach(s => s.classList.remove('active', 'salir-izquierda', 'entrar-derecha'));

            if (direction === 'next') {
                currentSlide.classList.add('salir-izquierda');
                nextSlide.classList.add('entrar-derecha');
                void nextSlide.offsetWidth;
                nextSlide.classList.remove('entrar-derecha');
                nextSlide.classList.add('active');
            } else {
                currentSlide.style.transform = 'translateX(60px) scale(0.98)';
                currentSlide.style.opacity = '0';
                nextSlide.style.transform = 'translateX(-60px) scale(0.98)';
                nextSlide.style.opacity = '0';
                void nextSlide.offsetWidth;
                nextSlide.style.transform = 'translateX(0) scale(1)';
                nextSlide.style.opacity = '1';
                nextSlide.classList.add('active');
            }

            currentSlideIndex = newIndex;
            updateUI();

            setTimeout(() => { isAnimating = false; }, 580);
        }

        function nextSlide() { if (currentSlideIndex < totalSlides - 1) showSlide(currentSlideIndex + 1, 'next'); }
        function prevSlide() { if (currentSlideIndex > 0) showSlide(currentSlideIndex - 1, 'prev'); }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);
        btnBackMenu.addEventListener('click', volverAlMenu);

        document.addEventListener('keydown', (e) => {
            if (currentTemaIndex === -1) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); nextSlide(); }
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevSlide(); }
        });

        slidesContainer.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        slidesContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) { if (diff > 0) nextSlide(); else prevSlide(); }
        }, { passive: true });
    </script>
</body>
</html>
